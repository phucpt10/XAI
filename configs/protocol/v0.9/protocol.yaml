schema_version: "0.9"
protocol_version: "v0.9"
status: draft
frozen: false
frozen_at: null
protocol_hash: null
seed: 42

governance:
  G0A_BOOTSTRAP_READY: pass
  G0B_PROTOCOL_FREEZE_READY: blocked
  blockers:
    - transformation_severity_pilot_not_executed
  G1_CHECKPOINT_SELECTION: blocked
  checkpoint_blockers:
    - resnet50_checkpoint_not_selected
    - efficientnet_b0_checkpoint_not_selected
  G2_TEST_EVALUATION_READY: blocked
  test_evaluation_blockers:
    - protocol_not_frozen
    - checkpoints_not_approved
    - final_freeze_artifacts_not_rebound
  evidence_records:
    runtime_readiness: DR-RUNTIME-001
    xai_target_layers: DR-XAI-001
  official_experiment_allowed: false
  official_training_allowed: false
  official_test_evaluation_allowed: false

dataset:
  source: "mohanty/PlantVillage"
  loader: huggingface_datasets
  configuration: "color"
  revision: "9e97599868962bd0079b8db4b7f1efa9185fa1e7"
  classes:
    - "Tomato___healthy"
    - "Tomato___Bacterial_spot"
    - "Tomato___Early_blight"
    - "Tomato___Late_blight"
    - "Tomato___Septoria_leaf_spot"
  group_key: leaf_id
  official_test_policy: preserve
  quarantine_policy:
    enabled: true
    decision_record: DR-DUP-001
    official_test_action: preserve_exactly
    train_test_leaf_overlap_action: quarantine_source_train
  image_size: [224, 224]
  rgb_range: [0.0, 1.0]
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

models:
  - resnet50
  - efficientnet_b0

training:
  pretrained: true
  pretrained_weights:
    resnet50: IMAGENET1K_V2
    efficientnet_b0: IMAGENET1K_V1
  fine_tuning: full_model
  loss: cross_entropy
  class_weighting: none
  max_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 8
  selection_metric: validation_macro_f1
  mixed_precision: true
  deterministic_algorithms: true

transformations:
  algorithm_version: shared_randomization_reflect_pad_v4
  names: [rotation, brightness, gaussian_noise, gaussian_blur]
  severities: [mild, moderate, severe]
  materialize_images: false
  deterministic_per_sample_seed: true
  record_exact_parameters: true
  parameters:
    rotation:
      mild: {angle_degrees: 10.0, padding_policy: reflect, padding_max_angle_degrees: 45.0, padding_margin_pixels: 2, interpolation: bilinear}
      moderate: {angle_degrees: 25.0, padding_policy: reflect, padding_max_angle_degrees: 45.0, padding_margin_pixels: 2, interpolation: bilinear}
      severe: {angle_degrees: 45.0, padding_policy: reflect, padding_max_angle_degrees: 45.0, padding_margin_pixels: 2, interpolation: bilinear}
    brightness:
      mild: {factor: 0.10}
      moderate: {factor: 0.30}
      severe: {factor: 0.50}
    gaussian_noise:
      mild: {sigma: 0.01, mean: 0.0}
      moderate: {sigma: 0.05, mean: 0.0}
      severe: {sigma: 0.10, mean: 0.0}
    gaussian_blur:
      mild: {kernel_size: 3, sigma: 0.8}
      moderate: {kernel_size: 5, sigma: 1.5}
      severe: {kernel_size: 9, sigma: 3.0}

xai:
  methods: [grad_cam, grad_cam_plus_plus, score_cam]
  target_layer_decision_record: DR-XAI-001
  target_layers:
    resnet50: "layer4[-1]"
    efficientnet_b0: "features[-1]"
  heatmap_epsilon: 1.0e-8
  constant_heatmap_policy: record_nan_with_reason

statistics:
  bootstrap_unit: leaf_id
  bootstrap_iterations: 10000
  confidence_level: 0.95
  seed: 42
  test: paired_wilcoxon
  zero_method: pratt
  correction: holm
  alpha: 0.05
  effect_size: rank_biserial
