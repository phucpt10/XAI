decision: >-
  Approve severity pilot and visual review v6 for G0B. Severity labels are
  ordinal only within each transformation family and must not be interpreted
  as calibrated equivalents across transformation families.
claim_boundary: >-
  Rotation prediction robustness is specific to the declared zero-filled
  operator. Explanation stability requires forward alignment of the original
  CAM and comparison only on geometric valid support M_T. M_T is not a leaf or
  lesion segmentation mask, and it does not prevent zero-fill from influencing
  model predictions or internal activations.
project_owner_approval: >-
  Tôi phê duyệt kết quả severity pilot và visual review v6 với trạng thái
  PASS_WITH_DECLARED_OPERATOR_LIMITATION. Severity chỉ có ý nghĩa thứ tự trong
  từng transformation; prediction robustness của rotation chỉ áp dụng cho
  zero-filled operator; XAI stability phải sử dụng forward alignment và valid
  region M_T.
