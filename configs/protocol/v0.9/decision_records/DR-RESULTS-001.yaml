decision: >-
  Freeze the exact official statistical-analysis report and its six child CSV
  artifacts for read-only reporting. Authorize deterministic tables, figures
  and structured summaries derived only from those artifacts. Retain all three
  Score-CAM by Gaussian-blur-severe endpoint rows as non-estimable and never
  describe them as non-significant findings. Reporting must not decode images,
  recompute predictions or CAMs, alter the registered analysis, select a model
  or method, or tune any scientific component.

project_owner_approval: >-
  Tôi phê duyệt đóng băng kết quả phân tích chính thức dựa trên report SHA
  68a9b47fddb2f203aa35a78645849f4e15c11379dbba6dfc79c9a188557294de.
  Cho phép tạo DR-RESULTS-001 và triển khai trình tạo bảng, hình và bản tóm tắt
  kết quả fail-closed từ đúng các artifact đã xác minh. Ba dòng Score-CAM ×
  Gaussian blur severe phải tiếp tục được báo cáo là non-estimable, không được
  diễn giải như kết quả không có ý nghĩa thống kê. Không chạy lại official test
  và không sử dụng kết quả để lựa chọn hoặc tinh chỉnh hệ thống.
