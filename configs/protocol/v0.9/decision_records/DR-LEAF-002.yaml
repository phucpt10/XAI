rationale: >-
  The pinned source split contains five filename-reconstructed biological leaf
  identities in both train and test. Preserving all official test samples and
  excluding only their five source-train counterparts removes model exposure
  to test leaves with the smallest protocol change. The ten conflict members
  remain visible in lineage evidence; only five train samples become ineligible.
