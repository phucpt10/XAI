decision: >-
  Retain the single insufficient-support contrast in the fixed output schema as
  three endpoint-specific non-estimable rows. Do not calculate a Wilcoxon test,
  effect size, confidence interval or reportable p-value for those rows. Preserve
  each predeclared Holm family by reserving the non-estimable member with an
  adjustment-only value of 1.0; this value is not an estimated or reported
  p-value. Authorize the remaining 573 estimable endpoint-specific comparisons
  without changing the minimum paired-leaf threshold, endpoints, families,
  models, transformations or XAI methods.

project_owner_approval: >-
  Tôi phê duyệt DR-ANALYSIS-SUPPORT-001 dựa trên support audit SHA
  f370b3c7ace79cd5523242831593522671844f6459d2fa344f21f829613c13ac.
  Cho phép đánh dấu rq2_model::score_cam::gaussian_blur_severe là
  NOT_ESTIMABLE_INSUFFICIENT_COMMON_LEAVES, giữ nguyên ngưỡng 20 paired leaves
  và toàn bộ Holm families đã đăng ký. Ba endpoint-specific rows tương ứng phải
  được giữ lại dưới dạng non-estimable, không tính kiểm định hay effect size;
  các family slots được bảo toàn theo cách bảo thủ. Cho phép tiếp tục 573 kiểm
  định estimable; không thay đổi hoặc tinh chỉnh model, transformation, XAI,
  endpoint hay protocol dựa trên official-test results.
