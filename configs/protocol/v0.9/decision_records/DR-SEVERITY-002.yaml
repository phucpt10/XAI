  rotation_failure_reason: >-
    Constant black triangular corners increase with rotation angle. They are a
    severity-correlated artificial cue that can affect prediction and CAM
    independently of the rotated biological content.
decision: >-
  Reject the complete v2 severity set. Retain the three visually acceptable
  transformation families, but do not approve G0B while rotation uses constant
  black fill.
required_corrective_action: >-
  Replace constant black fill with a deterministic per-image border-median RGB
  fill, pin a new algorithm version, and rerun all twelve scenarios and visual
  review in immutable v3 directories.
