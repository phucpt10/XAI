decision: >-
  Authorize the single registered official-test campaign for both approved
  backbones. Authorization is conditional on a passing fail-closed runtime
  gate. This decision prohibits using official-test observations to reselect or
  tune checkpoints, models, transformations or XAI methods.

project_owner_approval: >-
  Tôi phê duyệt G2 dựa trên readiness report SHA
  e80184dd2e6d7c55df66eb266a94ec33addda8048731fdaa26a8195f8e82a7bc.
  Cho phép một chiến dịch official-test evaluation đã đăng ký cho cả ResNet50
  và EfficientNet-B0, gồm baseline prediction và joint robustness/XAI theo 12
  scenario, 3 CAM methods và protocol đã khóa. Không sử dụng kết quả test để
  chọn lại hoặc tinh chỉnh mô hình, transformation hay XAI. Cho phép tạo
  DR-TEST-001 và triển khai cổng authorization fail-closed; chưa chạy test cho
  đến khi cổng này được kiểm chứng.
