decision: >-
  Reject this reconstruction evidence for official manifest creation because
  five reconstructed leaf identities cross the upstream train/test boundary.
  Do not move, remove, relabel or disambiguate affected samples without a new
  reviewed Decision Record and protocol change.
rationale: >-
  Filename reconstruction is considered only because the pinned upstream
  loader explicitly defines the same fallback rule. It is not approved until
  sample-level comparison and leakage/conflict checks pass.
