rationale: >-
  All nine remaining exact-pixel duplicate groups are train-only pairs with one
  class and one leaf identity. Keeping both copies would double-weight identical
  pixels from those leaves during model fitting. The minimum stable sample_id is
  retained and the other source sample is quarantined without consulting model
  performance or modifying official test.
