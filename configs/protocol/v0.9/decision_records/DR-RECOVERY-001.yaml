  physical_freeze_hash_must_be_distinct_from_historical_hash: true
  logical_historical_freeze_lineage_preserved: true
  verify_all_manifest_image_hashes_before_reauthorization: true
  no_dataset_change: true
  no_split_change: true
  no_checkpoint_change: true
  no_transformation_change: true
  no_xai_change: true
  no_scientific_protocol_change: true
  no_result_change: true
