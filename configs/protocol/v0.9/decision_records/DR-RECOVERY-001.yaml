  no_completed_resnet50_grad_cam_rerun: true
  no_test_based_selection_or_tuning: true
  fail_closed_on_any_mismatch: true

decision: >-
  Authorize reconstruction of physical freeze artifacts solely to recover from
  ephemeral Colab storage loss. The historical final freeze SHA remains the
  logical scientific lineage. A newly generated physical freeze SHA must be
  recorded separately and may be used only through a passing recovery binding
  gate. Existing baseline results and the completed ResNet50 Grad-CAM part are
  immutable and must not be recomputed.

project_owner_approval: >-
  Tôi phê duyệt DR-RECOVERY-001 dựa trên archive SHA
  0669d3eb6e26c7752b9fa1bf240f54f136e7d2c031653aa72436695a8e0c7930 và
  recovery audit SHA
  f21999cb39843218200f61ae6e20fbf078e2111be32f45b0c3ffd47e62418d43.
  Cho phép tái dựng physical freeze artifacts từ manifest SHA
  323b48e3564708d566e0e9f5c346a07ef728828b2879fc1975e21ca32e024894 và
  8.384 ảnh đã xác minh, đồng thời tạo fail-closed lineage bridge tới
  historical final freeze SHA
  aed2e96afd2749250d4151780bb4002d198eb96d7433d2bef5b03d4a6ac9212d.
  Recovery chỉ là xử lý hạ tầng, không thay đổi dataset, split, checkpoint,
  transformation, XAI, protocol khoa học hoặc kết quả đã có; không chạy lại
  baseline hay ResNet50 Grad-CAM; chỉ tiếp tục năm model-method parts còn lại
  sau khi recovery gate PASS. Không sử dụng kết quả official test để lựa chọn
  hoặc tinh chỉnh hệ thống.
