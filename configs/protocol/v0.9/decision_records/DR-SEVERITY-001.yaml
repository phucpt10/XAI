  root_cause: >-
    The random seed included scenario_id, so mild, moderate and severe drew
    independent brightening or darkening directions for the same sample.
  additional_affected_transformations:
    - rotation_direction
    - gaussian_noise_realization
decision: >-
  Reject pilot v1 despite its numerical technical gate. Its severity levels do
  not isolate perturbation magnitude because stochastic nuisance variables are
  resampled independently across levels.
required_corrective_action: >-
  Pin a new transformation algorithm that shares direction or base noise by
  sample_id and transformation across all severity levels, then rerun the pilot
  and visual review in new immutable v2 directories.
