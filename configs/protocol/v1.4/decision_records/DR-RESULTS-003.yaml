    - supplement_classwise_rq1.csv
    - supplement_classwise_xai_valid_coverage.csv
    - supplement_classwise_xai_descriptive.csv
    - supplement_leave_one_class_out_rq1.csv
    - supplement_leave_one_class_out_xai.csv
    - supplement_classwise_methodology.md
    - classwise_supplementary_report.json

constraints:
  source_artifacts_read_only: true
  official_test_pixels_accessed: false
  predictions_or_cams_recomputed: false
  no_new_hypothesis_tests: true
  no_new_confidence_intervals: true
  no_endpoint_or_holm_family_changes: true
  no_model_or_method_selection: true
  no_tuning: true
  classwise_results_descriptive_only: true
  leave_one_class_out_is_sensitivity_diagnostic_only: true
  xai_metrics_conditional_on_valid_prediction_consistent_cam: true
  external_generalization_claims_prohibited: true

decision: >-
  Authorize one deterministic, read-only supplementary reporting run from the
  exact corrected v1.4 analysis and merge artifacts named above. The run may
  tabulate classwise descriptive summaries, valid-CAM coverage, and
  leave-one-class-out sensitivity diagnostics. It must not read image pixels,
  recompute predictions or CAMs, add inferential tests or confidence intervals,
  alter registered endpoints or multiplicity families, select models or XAI
  methods, or tune any component. The outputs must be labeled descriptive and
  conditional on valid, prediction-consistent CAM records where applicable.

project_owner_approval: >-
  Approved by the project owner on 2026-07-25 to make the classwise sensitivity
  evidence transparent as a read-only supplementary analysis.
