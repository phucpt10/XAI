decision: >-
  Freeze exactly the corrected protocol v1.4 official-analysis report and its
  six verified CSV artifacts for read-only reporting. All 576 predeclared
  paired comparisons are estimable; this does not authorize changes to the
  scientific plan. Reporting may derive only the listed deterministic tables,
  figures and summaries, and must not access image pixels, recompute
  predictions or CAMs, alter endpoints or Holm families, select models or XAI
  methods, or tune any system component.

