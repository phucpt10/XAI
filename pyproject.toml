[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantxai-stability"
version = "0.1.0"
description = "Reproducible research software for prediction robustness and XAI explanation stability."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "Pillow>=10.0",
  "opencv-python-headless==4.13.0.92",
]

[project.optional-dependencies]
hf = ["datasets>=2.18", "huggingface_hub>=0.23", "pyarrow>=12.0"]
ml = ["torch>=2.1", "torchvision>=0.16", "scikit-learn>=1.3"]
xai = ["grad-cam>=1.5", "scikit-image>=0.21", "scipy>=1.10"]
report = ["matplotlib>=3.8"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
plantxai = "plantxai_stability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
